name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wsg
          POSTGRES_PASSWORD: wsg
          POSTGRES_DB: wsg
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wsg" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgres://wsg:wsg@localhost:5432/wsg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
